<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>QueryForge - AI SQL Assistant</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap');

body {
    margin: 0;
    font-family: 'Outfit', sans-serif;
    background: #0f172a;
    color: white;
    overflow-x: hidden;
}

.hero {
    position: relative;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: clamp(40px, 10vh, 80px) 10%;
    background: radial-gradient(circle at 20% 50%, rgba(56, 189, 248, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 50%, rgba(139, 92, 246, 0.15) 0%, transparent 50%);
}

.particles {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    overflow: hidden;
    z-index: 1;
}

.content {
    flex: 1;
    max-width: 600px;
    z-index: 2;
}

.gradient-text {
    font-size: clamp(40px, 5vw, 70px);
    font-weight: 800;
    line-height: 1.1;
    margin-bottom: 20px;
    background: linear-gradient(135deg, #e0f2fe, #38bdf8 50%, #8b5cf6);
    -webkit-background-clip: text;
    color: transparent;
}

.ai-glow {
    text-shadow: 0 0 20px rgba(56, 189, 248, 0.5);
}

.content p {
    font-size: 1.2rem;
    color: #94a3b8;
    margin-bottom: 40px;
    line-height: 1.6;
}

.features {
    display: flex;
    gap: 20px;
    margin-bottom: 40px;
    flex-wrap: wrap;
}

.feature {
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(255, 255, 255, 0.05);
    padding: 10px 20px;
    border-radius: 30px;
    backdrop-filter: blur(10px);
    color: #e2e8f0;
    font-weight: 300;
    transition: transform 0.3s;
}

.feature:hover {
    transform: translateY(-2px);
    background: rgba(255, 255, 255, 0.08);
}

.feature i {
    color: #38bdf8;
}

.start-btn {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 16px 36px;
    border-radius: 30px;
    background: linear-gradient(135deg, #38bdf8, #8b5cf6);
    color: white;
    text-decoration: none;
    font-weight: 600;
    font-size: 1.1rem;
    box-shadow: 0 10px 30px rgba(139, 92, 246, 0.3);
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    position: relative;
    overflow: hidden;
}

.start-btn::before {
    content: '';
    position: absolute;
    top: 0; left: -100%; width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
    transition: 0.5s;
}

.start-btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 15px 40px rgba(139, 92, 246, 0.5);
}

.start-btn:hover::before {
    left: 100%;
}

.hero-image {
    flex: 1;
    display: flex;
    justify-content: center;
    position: relative;
    z-index: 2;
}

.hero-image img {
    width: 100%;
    max-width: 500px;
    animation: floatImage 6s ease-in-out infinite;
    filter: drop-shadow(0 20px 40px rgba(56, 189, 248, 0.2));
}

@keyframes floatImage {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-30px); }
}

.floating-cards {
    position: absolute;
    right: -50px;
    top: 50%;
    transform: translateY(-50%);
    z-index: 3;
    pointer-events: none;
}

.floating-card {
    backdrop-filter: blur(15px);
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 16px;
    padding: 15px 25px;
    margin: 15px 0;
    color: #f8fafc;
    font-weight: 600;
    box-shadow: 0 15px 35px rgba(0,0,0,0.2);
    animation: floatCard 4s ease-in-out infinite;
}

@keyframes floatCard {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
}

@media (max-width: 1024px) {
    .floating-cards { display: none; }
}

@media (max-width: 900px) {
    .hero {
        flex-direction: column;
        justify-content: center;
        text-align: center;
        padding: clamp(40px, 8vh, 100px) 5%;
    }
    .features {
        justify-content: center;
    }
    .hero-image img {
        max-width: 350px;
        margin-top: 40px;
    }
}
</style>
</head>
<body>

<div class="hero">
    <div class="particles"></div>

    <div class="content">
        <h1 class="gradient-text">
            AI-Powered SQL <br>
            QueryForge <span class="ai-glow">AI</span>
        </h1>
        <p>Transform natural language into perfect SQL queries with smart analytics, charts & insights.</p>

        <div class="features">
            <div class="feature"><i class="fa-solid fa-file-csv"></i> CSV & Database</div>
            <div class="feature"><i class="fa-solid fa-robot"></i> AI Generated SQL</div>
            <div class="feature"><i class="fa-solid fa-chart-column"></i> Visual Analytics</div>
        </div>

        <div style="display: flex; gap: 15px;">
            <a href="/login" class="start-btn">
                <i class="fa-solid fa-arrow-right-to-bracket"></i> Login
            </a>
            <a href="/register" class="start-btn" style="background: linear-gradient(135deg, #8b5cf6, #38bdf8);">
                <i class="fa-solid fa-user-plus"></i> Register
            </a>
        </div>
    </div>

    <div class="hero-image">
        <img src="{{ url_for('static', filename='images/ai-hero.png') }}" alt="AI bot" onerror="this.src='https://cdn-icons-png.flaticon.com/512/8651/8651341.png'">
        <div class="floating-cards">
            <div class="floating-card" style="animation-delay: 0s;">📊 Smart Analytics</div>
            <div class="floating-card" style="animation-delay: 0.5s;">⚡ Instant Charts</div>
            <div class="floating-card" style="animation-delay: 1s;">🔒 Secure & Private</div>
        </div>
    </div>
</div>

<script>
const particles = document.querySelector('.particles');
for (let i = 0; i < 40; i++) {
    let span = document.createElement('span');
    span.style.position = "absolute";
    span.style.width = Math.random() * 4 + 1 + "px";
    span.style.height = span.style.width;
    span.style.background = "white";
    span.style.borderRadius = "50%";
    span.style.left = Math.random() * 100 + "%";
    span.style.top = Math.random() * 100 + "%";
    span.style.opacity = Math.random() * 0.5 + 0.1;
    span.style.animation = `floatCard ${Math.random() * 5 + 3}s infinite alternate`;
    particles.appendChild(span);
}

document.addEventListener("mousemove", (e) => {
    const x = (window.innerWidth / 2 - e.clientX) / 40;
    const y = (window.innerHeight / 2 - e.clientY) / 40;
    const img = document.querySelector(".hero-image img");
    if(img) img.style.transform = `translate(${x}px, ${y}px)`;
});
</script>

</body>
</html>
